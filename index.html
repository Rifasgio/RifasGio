<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas Gio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Rifas Gio</h1>
    </header>

    <main>
        <!-- Imagen del premio -->
        <div class="contenedor-premio">
            <img src="premio.jpg" alt="Imagen del premio" class="imagen-premio">
        </div>

        <!-- Información de la rifa -->
        <section class="info-rifa">
            <section class="total-compra">
                <p><strong>Boletos seleccionados:</strong> <span id="cantidad-boletos">0</span></p>
                <p><strong>Total a pagar:</strong> $<span id="precio-total">0</span> MXN</p>
            </section>

            <p><strong>Precio por boleto:</strong> 150 MXN</p>
            <p><strong>Fecha del sorteo:</strong> Por definir</p>
            <!-- CORREGIDO: Ahora tiene la id 'numeros-restantes' para que JavaScript cambie el número solo -->
            <p><strong>Números restantes:</strong> <span id="numeros-restantes">10</span></p>
        </section>

        <!-- CONTENEDOR NUEVO: Aquí se va a pintar el reloj de 10 minutos automáticamente -->
        <div id="temporizador-apartado" style="display:none; text-align: center; color: #ff3333; margin: 15px 0; font-weight: bold; font-family: sans-serif;"></div>

        <!-- Cuadrícula de números -->
        <section class="cuadrula-numeros">
            <div class="linea">
                <button class="numero">0</button>
                <button class="numero">1</button>
                <button class="numero">2</button>
                <button class="numero">3</button>
                <button class="numero">4</button>
            </div>
            <div class="linea">
                <button class="numero">5</button>
                <button class="numero">6</button>
                <button class="numero">7</button>
                <button class="numero">8</button>
                <button class="numero">9</button>
            </div>
        </section>

        <!-- Botón de compra -->
        <div class="contenedor-compra">
            <button id="btn-comprar" class="btn-comprar">Comprar Boletos</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
