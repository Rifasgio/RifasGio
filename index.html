<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifas Gio</title>
<!-- Aquí corregimos tu línea 1 para que enlace bien el CSS -->
<link rel="stylesheet" href="style.css">
<style>
.comprar-btn {
    background-color: #25D366;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 30px;
    border: none;
    border-radius: 50px;
    box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
    cursor: pointer;
    transition: transform 0.2s;
    width: 90%;
    max-width: 320px;
}
.comprar-btn:active {
    transform: scale(0.95);
}
</style>

</head>
<body>

<header>
<h1>Rifas Gio</h1>
</header>

<main>
<!-- Imagen del premio (puedes cambiar 'premio.jpg' por el nombre real de tu foto) -->
<div class="contenedor-premio">
<img src="premio.jpg" alt="Imagen del premio" class="imagen-premio">
</div>

<!-- Información de la rifa -->
<section class="info-rifa">
<section class="total-compra">
<p><strong>Boletos seleccionados:</strong> <span id="cantidad-boletos">0</span></p>
<p><strong>Total a pagar:</strong> $<span id="precio-total">0</span> MXN</p>
</section>

<p><strong>Precio por boleto:</strong> 150 MXN</p>
<p><strong>Fecha del sorteo:</strong> Al llenarse la lista</p>
<p><strong>Dinámica:</strong> Con el último dígito del Sorteo Tris de la Lotería Nacional</p>
</section>

<!-- Tu cuadrícula de números corregida y en botones para que la gente pueda interactuar -->
<section class="cuadrula-numeros">
<div class="linea">
<button class="numero">0</button>
<button class="numero">1</button>
<button class="numero">2</button>
<button class="numero">3</button>
<button class="numero">4</button>
</div>
<div class="linea">
<button class="numero">5</button>
<button class="numero">6</button>
<button class="numero">7</button>
<button class="numero">8</button>
<button class="numero">9</button>
</div>
</section>
<!-- Botón de compra agregado -->
<div style="text-align: center; margin-top: 20px; width: 100%;">
    <button id="btn-comprar" class="comprar-btn">💬 ¡Comprar Boletos ahora!</button>
    <p style="color: #666; font-size: 13px; margin-top: 10px; font-family: sans-serif; padding: 0 10px;">
        🔒 <strong>Compra 100% segura:</strong> Tu boleto se valida directamente en nuestro WhatsApp oficial.
    </p>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
